name: Daily Digest

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Checkout FBPTradeBot for managers.json
        uses: actions/checkout@v4
        with:
          repository: zpressley/FBPTradeBot
          path: fbp-trade-bot
          token: ${{ secrets.GH_PAT }}

      - name: Copy managers.json to email-digest data/
        run: |
          mkdir -p data
          cp fbp-trade-bot/config/managers.json data/managers.json
          echo "✅ managers.json copied ($(wc -l < data/managers.json) lines)"

      - name: Run daily digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          COMBINED_PLAYERS_PATH: ./data/combined_players.json
          MY_TEAM_ABBR: WAR
        run: PYTHONPATH=. python src/daily_digest.py

      - name: Commit snapshots
        run: |
          git config --global user.name "email-digest-bot"
          git config --global user.email "bot@email-digest"
          git add data/snapshots/
          git diff --staged --quiet || git commit -m "chore: daily snapshot $(date +%Y-%m-%d)"
          git push
