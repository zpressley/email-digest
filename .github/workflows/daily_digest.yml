name: Daily Digest

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Yahoo token
        run: |
          echo '${{ secrets.YAHOO_TOKEN_JSON }}' > token.json
          python -c "import json; json.load(open('token.json'))" || (echo "❌ token.json is invalid — update YAHOO_TOKEN_JSON secret" && exit 1)

      - name: Checkout FBPTradeBot for managers.json
        uses: actions/checkout@v3
        with:
          repository: zpressley/FBPTradeBot
          path: fbp-trade-bot
          token: ${{ secrets.GH_PAT }}

      - name: Copy managers.json to email-digest data/
        run: |
          mkdir -p data
          cp fbp-trade-bot/config/managers.json data/managers.json
          echo "✅ managers.json copied ($(wc -l < data/managers.json) lines)"

      - name: Run daily digest
        env:
          YAHOO_TOKEN_PATH: ./token.json
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_LEAGUE_ID: ${{ secrets.YAHOO_LEAGUE_ID }}
          YAHOO_GAME_KEY: ${{ secrets.YAHOO_GAME_KEY }}
          YAHOO_TEAM_ID: ${{ secrets.YAHOO_TEAM_ID }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          COMBINED_PLAYERS_PATH: ./data/combined_players.json
          MY_TEAM_ABBR: WAR
        run: PYTHONPATH=. python src/daily_digest.py

      # Everything below runs even when the digest step failed. A delivery
      # failure must not also cost us the refreshed Yahoo token or the day's
      # snapshots — both are written before the email is sent.
      - name: Upload rendered digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-html
          path: data/last_digest.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Update Yahoo token secret
        if: always()
        run: |
          # always() means this can run after an earlier step failed, so never
          # write back a token.json that is missing or corrupt — that would
          # destroy a working YAHOO_TOKEN_JSON secret.
          if ! python -c "import json; json.load(open('token.json'))" 2>/dev/null; then
            echo "⚠️  token.json missing or invalid — leaving YAHOO_TOKEN_JSON untouched"
            exit 0
          fi
          cat token.json | gh secret set YAHOO_TOKEN_JSON
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Commit snapshots
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name "email-digest-bot"
          git config --global user.email "bot@email-digest"
          # git errors on a pathspec that does not exist yet; empty dirs are
          # ignored by git, so creating them first is a no-op when unused.
          mkdir -p data/snapshots data/statcast_snapshots
          git add data/snapshots/ data/statcast_snapshots/
          git diff --staged --quiet && exit 0
          git commit -m "chore: daily snapshot $(date +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull --rebase origin "$BRANCH" && git push origin HEAD:"$BRANCH" && exit 0
            echo "push failed — retry $i"
            sleep $((2 ** i))
          done
          echo "❌ could not push snapshots after 4 attempts"
          exit 1
